<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f3ea" />
    <meta
      name="description"
      content="선글라스와 스타일을 골라 나만의 화보를 완성하는 모바일 스타일링 게임"
    />
    <title>찰칵! 선글라스 스타일리스트</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="game" aria-live="polite">
        <section class="screen intro-screen is-active" data-screen="intro">
          <div class="intro-copy">
            <p class="brand">SUNNYSIDE STUDIO</p>
            <h1>찰칵!<br /><em>선글라스 스타일리스트</em></h1>
            <p class="intro-description">
              선글라스와 스타일을 골라<br />나만의 여름 화보를 완성해 보세요.
            </p>
            <button class="button button-primary" type="button" data-action="start">
              스타일링 시작
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="m9 5 7 7-7 7" />
              </svg>
            </button>
          </div>

          <div class="intro-visual" aria-hidden="true">
            <span class="intro-sun"></span>
            <div class="photo-frame">
              <div class="portrait portrait-intro">
                <span class="portrait-hair"></span>
                <span class="portrait-head"></span>
                <span class="portrait-neck"></span>
                <span class="portrait-body"></span>
                <span class="portrait-glasses glasses-cat">
                  <i></i><i></i><b></b>
                </span>
              </div>
              <span class="spark spark-one">✦</span>
              <span class="spark spark-two">✦</span>
            </div>
          </div>
        </section>

        <section class="screen styling-screen" data-screen="styling" aria-hidden="true">
          <header class="step-header">
            <button class="icon-button" type="button" data-action="back" aria-label="이전 단계">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 5-7 7 7 7" /></svg>
            </button>
            <div class="step-copy">
              <p data-step-count>1 / 3</p>
              <h2 data-step-title>선글라스를 골라주세요</h2>
            </div>
            <div class="step-dots" data-step-dots aria-label="스타일링 진행 단계">
              <span class="is-active"></span><span></span><span></span>
            </div>
          </header>

          <div class="studio" data-studio data-background="city">
            <div class="background-placeholder" aria-hidden="true">
              <span class="bg-sun"></span>
              <span class="bg-shape bg-shape-one"></span>
              <span class="bg-shape bg-shape-two"></span>
              <span class="bg-ground"></span>
            </div>
            <img class="background-asset" data-background-asset alt="" />

            <div class="character" data-character data-style="city" aria-label="선택한 스타일 미리보기">
              <div class="character-shadow" aria-hidden="true"></div>
              <div class="character-placeholder" aria-hidden="true">
                <span class="character-leg leg-left"></span>
                <span class="character-leg leg-right"></span>
                <span class="character-torso"></span>
                <span class="character-arm arm-left"></span>
                <span class="character-arm arm-right"></span>
                <span class="character-neck"></span>
                <span class="character-head"></span>
                <span class="character-ear"></span>
                <span class="character-hair hair-back"></span>
                <span class="character-hair hair-front"></span>
              </div>
              <img class="character-asset" data-character-asset alt="" />

              <div class="glasses-placeholder" data-glasses-shape="cat" aria-hidden="true">
                <span class="lens lens-left"></span>
                <span class="lens lens-right"></span>
                <span class="bridge"></span>
                <span class="temple temple-left"></span>
                <span class="temple temple-right"></span>
              </div>
              <img class="glasses-asset" data-glasses-asset alt="" />
            </div>

            <div class="studio-label" data-studio-label>도심의 오후</div>
            <div class="flash" data-flash aria-hidden="true"></div>
          </div>

          <section class="selection-panel" aria-label="아이템 선택">
            <div class="selection-rail-wrap">
              <button class="carousel-button previous" type="button" data-action="previous-item" aria-label="이전 아이템">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 5-7 7 7 7" /></svg>
              </button>
              <div class="selection-rail" data-options></div>
              <button class="carousel-button next" type="button" data-action="next-item" aria-label="다음 아이템">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 7 7-7 7" /></svg>
              </button>
            </div>
            <p class="swipe-hint">좌우로 넘기거나 원하는 아이템을 탭하세요</p>
            <button class="button button-primary next-step-button" type="button" data-action="next-step">
              <span data-next-label>이 선글라스로 결정</span>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 7 7-7 7" /></svg>
            </button>
          </section>
        </section>

        <section class="screen capture-screen" data-screen="capture" aria-hidden="true">
          <div class="capture-copy">
            <p>당신의 스타일을 촬영할게요</p>
            <strong data-countdown>3</strong>
          </div>
          <div class="capture-preview" data-capture-preview></div>
          <div class="capture-flash" data-capture-flash aria-hidden="true"></div>
        </section>

        <section class="screen result-screen" data-screen="result" aria-hidden="true">
          <header class="result-header">
            <p class="brand">SUNNYSIDE STUDIO</p>
            <h2>스타일 완성!</h2>
          </header>

          <article class="result-card">
            <div class="result-photo" data-result-photo></div>
            <div class="result-copy">
              <p>당신의 스타일은</p>
              <h3 data-result-name>액티브 시티</h3>
              <p class="result-description" data-result-description></p>
            </div>
          </article>

          <div class="selected-product">
            <span class="product-swatch" data-product-swatch aria-hidden="true"></span>
            <div>
              <small>MY SUNGLASSES</small>
              <strong data-product-name>캣아이 블랙</strong>
              <span data-product-description></span>
            </div>
          </div>

          <a class="button button-primary cta-button" href="#" data-action="product">
            내가 고른 선글라스 보기
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 7 7-7 7" /></svg>
          </a>
          <button class="button button-secondary" type="button" data-action="restart">다시 스타일링</button>
        </section>

        <div class="toast" data-toast role="status"></div>
      </section>
    </main>
    <script src="game.js"></script>
  </body>
</html>
