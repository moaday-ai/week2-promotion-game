<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      name="description"
      content="3초 동안 선글라스의 위치를 기억하는 모바일 기억력 게임"
    />
    <title>3초 선글라스 기억력</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="memory-game" data-game-root>
      <section class="screen start-screen is-active" data-screen="start">
        <div class="start-visual" aria-hidden="true">
          <span class="spark spark-left"></span>
          <img src="assets/cards/sunglasses-01.png" alt="" />
          <span class="spark spark-right"></span>
        </div>

        <div class="start-copy">
          <h1><strong>3초</strong> 선글라스 기억력</h1>
          <p>선글라스가 있던 위치를<br />3초 안에 기억하세요!</p>
        </div>

        <div class="start-guide" aria-label="게임 방법">
          <span><b>1</b> 위치 기억</span>
          <i aria-hidden="true"></i>
          <span><b>2</b> 정답 선택</span>
          <i aria-hidden="true"></i>
          <span><b>3</b> 총 3단계</span>
        </div>

        <button class="primary-button start-button" type="button" data-action="start">
          게임 시작
        </button>
      </section>

      <section class="screen play-screen" data-screen="play" aria-live="polite">
        <header class="game-header">
          <p class="game-title">3초 선글라스 기억력</p>
          <div class="hud">
            <div>
              <strong data-level>LEVEL 1 / 3</strong>
              <div class="level-track" aria-hidden="true">
                <span data-level-progress></span>
              </div>
            </div>
            <p class="score-pill">점수 <strong data-score>0</strong></p>
          </div>
        </header>

        <div class="phase-copy">
          <p class="phase-label" data-phase-label>위치를 기억하세요!</p>
          <h2 data-instruction>선글라스가 있던 위치를 기억하세요</h2>
          <p class="phase-support" data-phase-support>3초 뒤 카드가 사라져요</p>
        </div>

        <div class="timer-wrap" data-timer-wrap>
          <strong class="timer-number" data-countdown>3</strong>
          <div class="timer-track" aria-label="기억 시간 3초">
            <span data-timer-progress></span>
          </div>
        </div>

        <div class="target-wrap" data-target-wrap hidden>
          <div class="target-card">
            <img data-target-image alt="" />
          </div>
        </div>

        <div class="card-grid" data-card-grid aria-label="선글라스 카드"></div>

        <div class="feedback" data-feedback role="status" aria-live="assertive" hidden>
          <span class="feedback-icon" data-feedback-icon aria-hidden="true"></span>
          <div>
            <strong data-feedback-title></strong>
            <p data-feedback-copy></p>
          </div>
        </div>

        <button class="primary-button next-button" type="button" data-action="next" hidden>
          다음 LEVEL
        </button>
      </section>

      <section class="screen result-screen" data-screen="result">
        <div class="result-mark" data-result-mark aria-hidden="true">3/3</div>
        <p class="result-overline">기억력 테스트 완료!</p>
        <h2 data-result-title>선글라스 기억력 MASTER!</h2>

        <div class="result-score">
          <span>최종 점수</span>
          <strong><b data-final-score>300</b> / 300</strong>
          <p><b data-correct-count>3</b>문제 중 정답</p>
        </div>

        <div class="result-actions">
          <button class="primary-button" type="button" data-action="restart">다시 도전하기</button>
          <div class="promotion-copy">
            <p>기억력 테스트는 끝났습니다.<br />이번엔 실제 선글라스를 구경해볼까요?</p>
            <a class="cta-button" href="#" data-action="product">내 스타일 선글라스 보기</a>
          </div>
        </div>
      </section>

      <div class="toast" data-toast role="status" aria-live="polite"></div>
    </main>

    <script src="game.js"></script>
  </body>
</html>
